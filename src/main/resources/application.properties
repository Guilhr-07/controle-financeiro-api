spring.application.name=controle-financeiro-api

# PostgreSQL por padrão em produção; cai para H2 em memória se as vars não existirem.
spring.datasource.url=${DB_URL:jdbc:h2:mem:financeiro;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Dev com H2: o Hibernate cria/atualiza as tabelas e o Flyway fica desligado.
# No perfil "postgres" (application-postgres.properties) o schema vem das migrations.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
