# Config só de testes: banco H2 isolado e sem seed (cada teste cria seus próprios dados,
# o que também evita colisão da semente entre contextos de teste distintos).
spring.datasource.url=jdbc:h2:mem:financeiro_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

# Espelha o dev: Hibernate cria o schema no H2; as migrations são testadas em MigracaoFlywayTest.
spring.flyway.enabled=false
